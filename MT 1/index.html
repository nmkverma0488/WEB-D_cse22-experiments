<!DOCTYPE html>
<html lang="en"



<head>
<title> HOTEL ROOM BOOKING</title>
</head>
<body>

<form action="#" method="post">
<table border="1" cellspacing="10">
<h2  align="center">Hotel Room Booking</h2>
<fieldset>
    <legend>Personal information</legend>


<label for="Name">full name</label>
<input type="Name" id="Name" Name="name" required>
<br><br>
<label for="phone">Contact Number:</label>
<input type="tel" id="phone" Name="phone" required>
<br><br>
<label for="mail">Email</label>
<input type="Name" id="Name" Name="email" required>
<br><br>
<label for="room">Room type</label>
<select  id ="room" name="room"required>
<option type="single">Single room</option>
<option type="double">double Seater</option>
<option type="triple">triple seater</option>
<br><br>

 <label for="Guests">Number of Guests:</label>
        <input type="number" id="Guests" name="Guests" min="1" max="10" required>
        <br><br>
        <label for="requests">Special Requests:</label>
        <textarea id ="requests" name="requests" rows="5" cols="50"></textarea>
        <br><br>
        <!-- buttons -->
         <button type ="Sumbit">Book Now</button>
         <button type="Restart">Restart</button>
          </fieldset>
           </form>
           </body>
</html>
