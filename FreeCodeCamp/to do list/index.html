<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheeet" href="styles.css"
</head>

<body>
<ul class="todo-list">
    <li class="todo-list">
        <input type="checkbox" id="taskname">
        <label for="taskname">Task Name</label>
        <ul class="sub-item">
            <li class="sub-item">
                <a class="sub-item-link" href="#"  target="_blank">Click here</a>
            </li>
        </ul>
    </li>

    <li class="todo-list">
        <input type="checkbox" id="description">
        <label for="description">Description</label>
        <ul class="sub-item">
            <li class="sub-item">
                <a class="sub-item-link" href="#"  target="_blank">Open card</a>
            </li>
        </ul>
    </li>

    <li class="todo-list">
        <input type="checkbox" id="duedate">
        <label for="duedate">Due Date</label>
        <ul class="sub-item">
            <li class="sub-item">
                <a class="sub-item-link" href="#" target="_blank">Read More</a>
            </li>
        </ul>
    </li>

    <li class="todo-list">
        <input type="checkbox" id="priority">
        <label for="priority">Priority</label>
        <ul class="sub-item">
            <li class="sub-item">
                <a class="sub-item-link" href="#"  target="_blank">close here</a>
            </li>
        </ul>
    </li>
</ul>



</body>

</html>
