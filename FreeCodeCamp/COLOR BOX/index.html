
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Grid</title>
    <style>
        /* 1. Body background color */
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 2. color-grid container */
        .color-grid {
            display: flex;
            gap: 15px;
        }

        /* 5. color-box fixed width and height */
        .color-box {
            width: 100px;
            height: 100px;
        }

        /* 6. Hexadecimal color */
        .color1 {
            background-color: #ff5733;
        }

        /* 7. RGB color */
        .color2 {
            background-color: rgb(0, 128, 255);
        }

        /* 8. Predefined word color */
        .color3 {
            background-color: green;
        }

        /* 9. HSL color */
        .color4 {
            background-color: hsl(280, 60%, 50%);
        }

        /* 10. RGBA color */
        .color5 {
            background-color: rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- 2. Main container -->
    <div class="color-grid">
        <!-- 3 & 4. Five divs with required classes -->
        <div class="color-box color1"></div>
        <div class="color-box color2"></div>
        <div class="color-box color3"></div>
        <div class="color-box color4"></div>
        <div class="color-box color5"></div>
    </div>

</body
