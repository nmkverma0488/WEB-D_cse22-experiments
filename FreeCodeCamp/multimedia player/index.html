<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
<h1>Multimedia Player</h1>
<section>
  <h2>Song Playing</h2>
  <audio controls="" aria-label="Rise Beyond movie audio transcript">
    <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="mp3"></audio>
  </section>
<section>
  <h2>vedio playing</h2> 
  
  <video controls="" width="700" aria-label="">
    <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="mp4">
    <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="caption" srclang="en" label="english-caption">
  </vedio>

</section>
<section>
  <h2>Transcript</h2>
  <p>This video includes spoken dialogue, background narration, and descriptions
  of important scenes from the movie Rise Beyond to help users understand the content.
</p></p>
</section>
</body>

</html>
