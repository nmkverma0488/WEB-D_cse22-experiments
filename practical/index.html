<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>
<style>
body{
font-family:arial,'sans-serif';
margin:65px;
}
h1{
font-size:23px;
color:black;
}
form{
    background-color:hotpink;
height:300px;
width:300px;

}
</style>
</head>
<body>
<h1>Student Registration Form</h1>
<!--personal informataion-->
<form action="#" type="form">

<fieldset>
<label for="name">Student full name:</label>
<input type="text" id="name" name="Name" placeholder="enter your full name" required>
<br></br>
<!--eamil-->

<label for="email">E-mail:</label>
<input type="email" id="email" name="email"  placeholder="enter your email" required>
<br></br>

<!--number-->
<label for="number">Phone number:</label>
<input type="tel" id="phonenumber" name="phonenumber"  placeholder="enter your mobile number" required>
<br></br>

<!--course-->

<label for="course">course:</label>
<select for="course">
<option value="course-1">JEE</option>
<option value="course-2">NEET</option>
<option value="course-3">SSC</option>
</select>

<br></br>

<label for="btn">Select button:</label>
<button type="register">registration now</button>
<button type="log out">Log out</button>




</fieldset>
</form>
</body>




</html>
